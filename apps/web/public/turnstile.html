<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="turnstile-container"></div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const siteKey = params.get('siteKey');
      const locale = params.get('locale');
      const theme = params.get('theme');

      const localeMap = {
        es: 'es',
        en: 'en',
        fr: 'fr',
        'pt-BR': 'pt-BR'
      };

      function resolveLanguage(value) {
        if (!value) {
          return 'auto';
        }

        return localeMap[value] || 'auto';
      }

      function resolveTheme(value) {
        if (value === 'light' || value === 'dark' || value === 'auto') {
          return value;
        }

        return 'auto';
      }
      
      function initTurnstile() {
        if (siteKey && typeof turnstile !== 'undefined') {
          turnstile.render('#turnstile-container', {
            sitekey: siteKey,
            language: resolveLanguage(locale),
            theme: resolveTheme(theme),
            callback: function(token) {
              if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'success', token: token }));
              } else {
                console.log('Token:', token);
              }
            },
            'error-callback': function(error) {
              if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'error', error: String(error) }));
              } else {
                console.error('Error:', error);
              }
            },
            'expired-callback': function() {
              if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'expired' }));
              } else {
                console.warn('Turnstile token expired');
              }
            }
          });
        }
      }
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=initTurnstile" async defer></script>
  </body>
</html>
